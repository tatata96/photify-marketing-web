    {
      "@context": "https://schema.org",

        {
          "@type": "Organization",
          "@id": "https://photify.studio/#organization",
          "name": "Photify",
          "url": "https://photify.studio",
          "logo": "https://photify.studio/logo/logo.jpeg",
          "email": "hello@photify.app",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Istanbul",
            "addressCountry": "TR"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@photify.app",
            "contactType": "customer support"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://photify.studio/#software",
          "name": "Photify",
          "applicationCategory": "PhotographyApplication",
          "operatingSystem": "Web, iOS, Android",
          "url": "https://photify.studio",
          "description": "AI event photo delivery platform. Guests scan a QR code, AI face recognition builds personalized albums, and photos are delivered in real time.",
          "publisher": { "@id": "https://photify.studio/#organization" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "Free plan with up to 50 photos per event."
          },
          "featureList": [
            "QR code instant access",
            "AI face recognition",
            "Real-time photo delivery",
            "Private, personalized albums",
            "GDPR-compliant privacy"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://photify.studio/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does Photify deliver event photos to guests?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Guests scan a QR code to join the event, and Photify's AI face recognition identifies them across every uploaded photo, then delivers a personalized album in real time — no app download or manual sorting required."
              }
            },
            {
              "@type": "Question",
              "name": "Do guests need to download an app to get their photos?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Guests simply scan a QR code with their phone camera to access their personalized photo album directly in the browser."
              }
            },
            {
              "@type": "Question",
              "name": "Is Photify's face recognition GDPR compliant?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Photify is GDPR and KVKK compliant, uses encryption, and processes facial data only with explicit guest consent. Each guest sees only their own private album."
              }
            },
            {
              "@type": "Question",
              "name": "How much does Photify cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Photify is free to start, including up to 50 photos per event. Paid plans unlock higher volumes and additional features for larger events."
              }
            }
          ]
        }
      ]
    }
    </script>
